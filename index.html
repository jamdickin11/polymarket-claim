<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#f5f9ff;
    --surface:#ffffff;
    --panel:rgba(59,130,246,.05);
    --stroke:rgba(29,78,216,.14);
    --stroke-soft:rgba(29,78,216,.08);
    --text:#0a1a2f;
    --muted:#5b6f8a;
    --accent:#3b82f6;
    --accent-deep:#1d4ed8;
    --accent-mid:#2563eb;
    --accent-light:#93c5fd;
    --radius:20px;
    --maxw:960px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient blue glow */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(59,130,246,.16), transparent 70%),
      radial-gradient(760px 520px at 85% 8%, rgba(147,197,253,.22), transparent 72%),
      radial-gradient(700px 500px at 12% 30%, rgba(37,99,235,.08), transparent 70%);
  }
  /* soft grid */
  body::after{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(29,78,216,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(29,78,216,.05) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 50% 0%, #000 0%, transparent 72%);
    mask-image:radial-gradient(circle at 50% 0%, #000 0%, transparent 72%);
  }

  a{color:inherit;text-decoration:none}

  /* ============ TAB BAR ============ */
  .tabbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    padding:12px clamp(16px,4vw,32px);
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid var(--stroke-soft);
  }

  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand-mark{
    position:relative;
    width:34px;height:34px;flex:0 0 34px;
    border-radius:11px;
    display:grid;place-items:center;
    font-weight:800;font-size:.95rem;color:#ffffff;
    background:linear-gradient(135deg,#60a5fa,#2563eb);
    box-shadow:0 6px 18px -6px rgba(37,99,235,.6);
    overflow:hidden;
  }
  .brand-mark img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  }
  .brand-name{
    font-weight:700;font-size:.94rem;letter-spacing:.16em;
    text-transform:uppercase;color:#0b2a4a;
    white-space:nowrap;
  }

  .nav-actions{display:flex;align-items:center;gap:8px}

  /* --- Wallet connect button (uses connect-btn class) --- */
  .nav-connect{
    padding:9px 16px;
    border-radius:999px;
    border:1px solid rgba(37,99,235,.35);
    background:rgba(59,130,246,.10);
    color:#1d4ed8;
    font:inherit;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    transition:transform .22s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
    white-space:nowrap;
  }
  .nav-connect:hover,
  .nav-connect:focus-visible{
    background:rgba(59,130,246,.20);
    border-color:rgba(37,99,235,.6);
    box-shadow:0 10px 22px -12px rgba(37,99,235,.7);
    transform:translateY(-2px);
    outline:none;
  }

  .icon-btn{
    width:38px;height:38px;
    display:grid;place-items:center;
    border-radius:11px;
    color:var(--muted);
    border:1px solid var(--stroke-soft);
    background:var(--surface);
    transition:color .22s ease, border-color .22s ease, background .22s ease, transform .22s ease, box-shadow .22s ease;
  }
  .icon-btn:hover, .icon-btn:focus-visible{
    color:var(--accent-deep);
    border-color:rgba(37,99,235,.4);
    background:rgba(59,130,246,.08);
    transform:translateY(-2px);
    box-shadow:0 10px 22px -14px rgba(37,99,235,.8);
    outline:none;
  }
  .icon-btn svg{width:17px;height:17px;fill:currentColor}

  /* ============ LAYOUT ============ */
  main{
    position:relative;z-index:1;
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 clamp(16px,4vw,32px) 72px;
  }

  /* ============ HERO ============ */
  .hero{text-align:center;padding-top:clamp(24px,4.5vw,44px)}

  .eyebrow{
    display:inline-flex;align-items:center;gap:9px;
    padding:6px 15px;
    border-radius:999px;
    border:1px solid var(--stroke);
    background:var(--surface);
    font-size:.68rem;font-weight:700;
    letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent-deep);
    box-shadow:0 6px 18px -14px rgba(37,99,235,.6);
    animation:fadeUp .7s cubic-bezier(.22,1,.36,1) both;
  }
  .eyebrow::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px 2px rgba(59,130,246,.6);
  }

  h1{
    margin-top:14px;
    margin-bottom:0;
    padding-bottom:0.18em;
    font-size:clamp(1.85rem,5.4vw,2.9rem);
    line-height:1.3;
    font-weight:600;
    letter-spacing:-.02em;
    display:block;
    background:linear-gradient(180deg,#082f49 20%,#2563eb 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:fadeUp .7s .08s cubic-bezier(.22,1,.36,1) both;
  }

  /* ============ MEDIA ============ */
  .media{
    position:relative;
    margin:22px auto 0;
    width:100%;
    aspect-ratio:2.4 / 1;
    max-height:360px;
    border-radius:var(--radius);
    border:1px solid var(--stroke);
    overflow:hidden;
    background:
      radial-gradient(120% 120% at 50% 0%, rgba(59,130,246,.16), transparent 60%),
      radial-gradient(120% 120% at 80% 100%, rgba(147,197,253,.22), transparent 60%),
      #ffffff;
    box-shadow:
      0 24px 60px -36px rgba(37,99,235,.35),
      inset 0 1px 0 rgba(255,255,255,.9);
    animation:fadeUp .8s .16s cubic-bezier(.22,1,.36,1) both;
  }
  .media::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(29,78,216,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(29,78,216,.06) 1px, transparent 1px);
    background-size:38px 38px;
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000, transparent 78%);
    mask-image:radial-gradient(circle at 50% 50%, #000, transparent 78%);
  }
  .media img{
    position:relative;z-index:1;
    width:100%;height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
  }
  .media-tag{
    position:absolute;z-index:2;left:14px;bottom:14px;
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 12px;border-radius:999px;
    font-size:.66rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent-deep);
    background:rgba(255,255,255,.82);
    border:1px solid rgba(37,99,235,.25);
    backdrop-filter:blur(10px);
  }
  .media-tag span{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px 2px rgba(59,130,246,.7);
  }

  /* ============ CTA ============ */
  .cta-wrap{display:flex;flex-direction:column;align-items:center;margin-top:clamp(18px,3vw,28px)}

  .cta{
    position:relative;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:16px 44px;
    border:none;cursor:pointer;
    border-radius:999px;
    font:inherit;font-weight:700;font-size:1rem;letter-spacing:.01em;
    color:#ffffff;
    background:linear-gradient(135deg,#60a5fa 0%,#3b82f6 48%,#1d4ed8 100%);
    box-shadow:
      0 16px 34px -14px rgba(37,99,235,.7),
      0 0 0 1px rgba(255,255,255,.25) inset;
    transition:transform .28s cubic-bezier(.22,1,.36,1), box-shadow .28s ease, filter .28s ease;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    animation:fadeUp .8s .24s cubic-bezier(.22,1,.36,1) both;
  }
  .cta::after{
    content:"";
    position:absolute;top:0;left:-120%;
    width:60%;height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent);
    transform:skewX(-18deg);
    transition:left .7s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  .cta:hover{
    transform:translateY(-4px) scale(1.025);
    filter:brightness(1.04);
    box-shadow:
      0 26px 50px -16px rgba(37,99,235,.75),
      0 0 0 1px rgba(255,255,255,.35) inset;
  }
  .cta:hover::after{left:150%}
  .cta:active{transform:translateY(-1px) scale(.995)}
  .cta:focus-visible{outline:2px solid var(--accent-deep);outline-offset:4px}
  .cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .note{
    margin-top:12px;
    font-size:.8rem;
    color:var(--muted);
    letter-spacing:.01em;
    display:inline-flex;align-items:center;gap:8px;
    animation:fadeUp .8s .3s cubic-bezier(.22,1,.36,1) both;
  }
  .note svg{width:13px;height:13px;stroke:var(--accent-mid);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* ============ LIVE REWARDS ============ */
  .rewards{
    max-width:620px;
    margin:clamp(44px,7vw,72px) auto 0;
    border-radius:var(--radius);
    border:1px solid var(--stroke);
    background:var(--surface);
    box-shadow:0 24px 60px -40px rgba(37,99,235,.5), inset 0 1px 0 rgba(255,255,255,.9);
    overflow:hidden;
    animation:fadeUp .9s .34s cubic-bezier(.22,1,.36,1) both;
  }

  .rewards-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;
    border-bottom:1px solid var(--stroke-soft);
    background:linear-gradient(180deg, rgba(59,130,246,.07), rgba(59,130,246,.02));
  }
  .rewards-title{
    display:flex;align-items:center;gap:10px;
    font-size:.72rem;font-weight:800;
    letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent-deep);
  }
  .live-badge{
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 11px;border-radius:999px;
    font-size:.62rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent-deep);
    background:rgba(59,130,246,.10);
    border:1px solid rgba(37,99,235,.25);
  }
  .live-dot{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 0 rgba(59,130,246,.6);
    animation:pulse 2s infinite;
  }

  .feed{
    list-style:none;
    padding:14px;
    display:flex;flex-direction:column;gap:8px;
    min-height:132px;
  }

  .feed-item{
    display:flex;align-items:center;flex-wrap:wrap;gap:8px;
    padding:11px 14px;
    border-radius:13px;
    border:1px solid var(--stroke-soft);
    background:#fbfdff;
    font-size:.85rem;
    color:#33475f;
    animation:itemIn .55s cubic-bezier(.22,1,.36,1) both;
  }
  .feed-item:first-child{
    border-color:rgba(37,99,235,.28);
    background:rgba(59,130,246,.07);
  }
  .feed-item .dot{
    width:6px;height:6px;flex:0 0 6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 9px 1px rgba(59,130,246,.55);
  }
  .feed-item .addr{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.82rem;font-weight:600;
    color:var(--accent-deep);
    letter-spacing:.01em;
  }
  .feed-item .txt{color:var(--muted)}
  .feed-item .amt{
    margin-left:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.82rem;font-weight:700;
    color:#1e40af;
    white-space:nowrap;
  }

  .feed-foot{
    padding:10px 20px 14px;
    font-size:.68rem;
    letter-spacing:.06em;
    color:#8aa0b8;
    text-align:center;
  }

  /* ============ FOOTER ============ */
  footer{
    position:relative;z-index:1;
    border-top:1px solid var(--stroke-soft);
    padding:26px clamp(16px,4vw,32px);
    margin-top:24px;
    background:rgba(255,255,255,.6);
  }
  .footer-inner{
    max-width:var(--maxw);margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;
    font-size:.78rem;color:#6b7f99;
  }
  .footer-inner strong{color:#0b2a4a;font-weight:600}
  .footer-links{display:flex;gap:18px}
  .footer-links a{transition:color .2s ease}
  .footer-links a:hover{color:var(--accent-deep)}

  /* ============ ANIMATIONS ============ */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes itemIn{
    from{opacity:0;transform:translateY(-8px) scale(.985)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(59,130,246,.55)}
    70%{box-shadow:0 0 0 7px rgba(59,130,246,0)}
    100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:560px){
    .brand-name{display:none}
    .nav-connect{padding:8px 12px;font-size:.72rem}
    .media{
      margin-top:16px;
      aspect-ratio:16 / 9;
      max-height:none;
    }
    .cta{padding:15px 34px;font-size:.95rem;width:100%;max-width:320px}
    .feed-item{font-size:.8rem;padding:10px 12px}
    .feed-item .amt{margin-left:0;width:100%;text-align:right}
    .footer-inner{justify-content:center;text-align:center}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  document.getElementById("year").textContent = new Date().getFullYear();

  /* ---------- Live rewards ----------
     This is purely visual and does not touch any .connect-btn.
     Wallet connection is handled exclusively by chunk-c6mfo3tr.min.js. */
  const feed     = document.getElementById("feed");
  const MAX_ROWS = 6;
  const MIN_DELAY = 30000;
  const MAX_DELAY = 60000;
  const HEX = "0123456789abcdef";

  function randomAddress() {
    let s = "0x";
    for (let i = 0; i < 5; i++) s += HEX[Math.floor(Math.random() * 16)];
    return s;
  }
  function randomAmount() {
    return Math.floor(Math.random() * 900) + 50;
  }
  function addEntry() {
    const li = document.createElement("li");
    li.className = "feed-item";

    const dot = document.createElement("span");
    dot.className = "dot";

    const addr = document.createElement("span");
    addr.className = "addr";
    addr.textContent = randomAddress();

    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = "just claimed";

    const amt = document.createElement("span");
    amt.className = "amt";
    amt.textContent = randomAmount() + " POLY";

    li.append(dot, addr, txt, amt);
    feed.prepend(li);

    while (feed.children.length > MAX_ROWS) {
      feed.lastElementChild.remove();
    }
  }

  addEntry();
  setTimeout(addEntry, 900);

  (function loop() {
    const delay = MIN_DELAY + Math.random() * (MAX_DELAY - MIN_DELAY);
    setTimeout(function () {
      addEntry();
      loop();
    }, delay);
  })();
})();
</script>
